<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/branding/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/branding/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/branding/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2EBDC" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A140E" />
    <script>
      // Default to light — only honor explicit user choice. System pref is ignored on first visit.
      (function () {
        try {
          var raw = localStorage.getItem("studio-jayjo-theme");
          var persisted = raw ? JSON.parse(raw) : null;
          var chosen = persisted && persisted.state && persisted.state.hasUserChoice ? persisted.state.theme : "light";
          document.documentElement.setAttribute("data-theme", chosen);
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <title>Studio JayJo</title>
    <meta name="description" content="Studio JayJo — original art, prints, and curated wall galleries." />
    <meta property="og:title" content="Studio JayJo" />
    <meta property="og:description" content="Original art, prints, and curated wall galleries." />
    <meta property="og:image" content="/og-default.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
